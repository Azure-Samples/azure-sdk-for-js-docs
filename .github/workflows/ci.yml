name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # The build-samples.yml workflow handles per-sample builds.
  # This job validates root-level install and lockfile integrity.
  install-check:
    name: Install check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - "."
          - "samples/identity/credentials"
          - "samples/identity/resources"
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: npm ci (${{ matrix.directory }})
        working-directory: ${{ matrix.directory }}
        run: npm ci
